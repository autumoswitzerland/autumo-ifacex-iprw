name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      version:
        description: 'Override version (leave empty to use make.sh default)'
        required: false
        default: ''
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests (Mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Run unit tests
        run: mvn test --no-transfer-progress --batch-mode -Denforcer.skip

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        module: [mod-ftp, mod-sftp, mod-webdav, mod-az-aws-s3, mod-bb-b2, mod-dbox, mod-google-drive, mod-google-storage, mod-ms-azure, mod-nifi, mod-os]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Run integration tests
        env:
          # FTP / SFTP
          FTP_TEST_HOST: ${{ secrets.FTP_TEST_HOST }}
          FTP_TEST_PORT: ${{ secrets.FTP_TEST_PORT }}
          FTP_TEST_USER: ${{ secrets.FTP_TEST_USER }}
          FTP_TEST_PASSWORD: ${{ secrets.FTP_TEST_PASSWORD }}
          FTP_TEST_DIR: ${{ secrets.FTP_TEST_DIR }}
          SFTP_TEST_HOST: ${{ secrets.SFTP_TEST_HOST }}
          SFTP_TEST_PORT: ${{ secrets.SFTP_TEST_PORT }}
          SFTP_TEST_USER: ${{ secrets.SFTP_TEST_USER }}
          SFTP_TEST_PASSWORD: ${{ secrets.SFTP_TEST_PASSWORD }}
          SFTP_TEST_DIR: ${{ secrets.SFTP_TEST_DIR }}
          # WebDAV
          WEBDAV_TEST_URL: ${{ secrets.WEBDAV_TEST_URL }}
          WEBDAV_TEST_USER: ${{ secrets.WEBDAV_TEST_USER }}
          WEBDAV_TEST_PASSWORD: ${{ secrets.WEBDAV_TEST_PASSWORD }}
          # AWS S3
          AWS_TEST_ACCESS_KEY: ${{ secrets.AWS_TEST_ACCESS_KEY }}
          AWS_TEST_SECRET_KEY: ${{ secrets.AWS_TEST_SECRET_KEY }}
          AWS_TEST_REGION: ${{ secrets.AWS_TEST_REGION }}
          AWS_TEST_BUCKET: ${{ secrets.AWS_TEST_BUCKET }}
          # Backblaze B2
          B2_TEST_KEY_ID: ${{ secrets.B2_TEST_KEY_ID }}
          B2_TEST_APP_KEY: ${{ secrets.B2_TEST_APP_KEY }}
          B2_TEST_BUCKET: ${{ secrets.B2_TEST_BUCKET }}
          # Dropbox
          DROPBOX_TEST_TOKEN: ${{ secrets.DROPBOX_TEST_TOKEN }}
          # Google Drive
          GDRIVE_TEST_CLIENT_ID: ${{ secrets.GDRIVE_TEST_CLIENT_ID }}
          GDRIVE_TEST_CLIENT_SECRET: ${{ secrets.GDRIVE_TEST_CLIENT_SECRET }}
          GDRIVE_TEST_REFRESH_TOKEN: ${{ secrets.GDRIVE_TEST_REFRESH_TOKEN }}
          GDRIVE_TEST_FOLDER: ${{ secrets.GDRIVE_TEST_FOLDER }}
          # Google Cloud Storage
          GCS_TEST_PROJECT_ID: ${{ secrets.GCS_TEST_PROJECT_ID }}
          GCS_TEST_CREDENTIALS_JSON: ${{ secrets.GCS_TEST_CREDENTIALS_JSON }}
          GCS_TEST_BUCKET: ${{ secrets.GCS_TEST_BUCKET }}
          # Azure
          AZURE_TEST_CONNECTION_STRING: ${{ secrets.AZURE_TEST_CONNECTION_STRING }}
          AZURE_TEST_CONTAINER: ${{ secrets.AZURE_TEST_CONTAINER }}
          # OpenStack Swift
          OS_TEST_URL: ${{ secrets.OS_TEST_URL }}
          OS_TEST_USER: ${{ secrets.OS_TEST_USER }}
          OS_TEST_PASSWORD: ${{ secrets.OS_TEST_PASSWORD }}
          OS_TEST_PROJECT: ${{ secrets.OS_TEST_PROJECT }}
          OS_TEST_DOMAIN: ${{ secrets.OS_TEST_DOMAIN }}
          OS_TEST_CONTAINER: ${{ secrets.OS_TEST_CONTAINER }}
          # NiFi
          NIFI_TEST_URL: ${{ secrets.NIFI_TEST_URL }}
          NIFI_TEST_PORT_NAME: ${{ secrets.NIFI_TEST_PORT_NAME }}
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
        run: |
          # Skip integration tests for modules without the required secrets
          MODULE="${{ matrix.module }}"
          SECRET_NAME=$(echo "$MODULE" | tr '[:lower:]-' '[:upper:]_' | sed 's/MOD_//')
          if [ -z "${!SECRET_NAME}" ]; then
            echo "No secrets for $MODULE — skipping integration tests"
            exit 0
          fi
          mvn -pl $MODULE -am verify --no-transfer-progress --batch-mode -Denforcer.skip -Dit.test=*IntegrationTest

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: integration-tests
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Resolve version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep 'IPRW_VERSION=' make.sh | head -1 | cut -d'=' -f2 | cut -d'#' -f1 | xargs)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Build modules
        run: mvn install -DskipTests --no-transfer-progress --batch-mode -Denforcer.skip
      - name: Create package
        run: IPRW_VERSION=${{ steps.version.outputs.version }} ./make.sh create
      - name: Extract changelog for release
        id: changelog
        if: ${{ inputs.create_release == 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            awk "/## \[$VERSION\]/{f=1;next}/## \[/{f=0}f" CHANGELOG.md > release-notes.md
          else
            echo "Release $VERSION" > release-notes.md
          fi
          # Use heredoc to write to GITHUB_OUTPUT safely
          {
            echo 'body<<RELEASE_EOF'
            cat release-notes.md
            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autumo-ifaceX-iprw-${{ steps.version.outputs.version }}
          path: product/autumo-ifaceX-iprw-${{ steps.version.outputs.version }}.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-package
    if: ${{ inputs.create_release == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: autumo-ifaceX-iprw-${{ needs.build-package.outputs.version }}
          path: product/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-package.outputs.version }}
          name: autumo-ifaceX IPRW ${{ needs.build-package.outputs.version }}
          body_path: product/release-notes.md
          files: product/autumo-ifaceX-iprw-${{ needs.build-package.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}